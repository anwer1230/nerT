##########################################################
#  render.yaml — إعدادات النشر على Render
#  مركز سرعة انجاز — Abu_Malk Telegram Platform
##########################################################

services:
  - type: web
    name: abu-malk-services
    runtime: python
    region: oregon          # أقرب منطقة لها خوادم تيليجرام جيدة
    plan: free              # غيّر إلى starter أو standard للإنتاج

    # ── بيئة Python ─────────────────────────────────────
    pythonVersion: "3.11"
    buildCommand: pip install -r requirements.txt

    # ── أمر التشغيل ─────────────────────────────────────
    # gunicorn مع eventlet لدعم Socket.IO
    startCommand: >
      gunicorn main:app
      --worker-class geventwebsocket.gunicorn.workers.GeventWebSocketWorker
      --workers 1
      --bind 0.0.0.0:$PORT
      --timeout 120
      --keep-alive 5
      --log-level info

    # ── متغيرات البيئة ─────────────────────────────────
    envVars:
      - key: RENDER
        value: "1"
      - key: SECRET_KEY
        generateValue: true           # توليد تلقائي من Render
      - key: PORT
        value: "10000"                # Render يضبطه تلقائياً
      - key: PYTHON_VERSION
        value: "3.11.0"

      # ← يجب إضافة هذه يدوياً في لوحة Render Dashboard:
      # - key: GROQ_API_KEY
      #   sync: false
      # - key: GITHUB_TOKEN
      #   sync: false
      # - key: SUPABASE_URL
      #   sync: false
      # - key: SUPABASE_KEY
      #   sync: false
      # - key: VAPID_PUBLIC_KEY
      #   sync: false
      # - key: VAPID_PRIVATE_KEY
      #   sync: false

    # ── إعدادات القرص الدائم (اختياري) ─────────────────
    # disk:
    #   name: sessions-data
    #   mountPath: /opt/render/project/src/sessions
    #   sizeGB: 1

    # ── فحص الصحة ──────────────────────────────────────
    healthCheckPath: /api/health

    # ── Auto-Deploy عند الدفع لـ GitHub ─────────────────
    autoDeploy: true
