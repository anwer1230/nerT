##########################################################
#  render.yaml — إعدادات النشر على Render
#  مركز سرعة انجاز — Abu_Malk Telegram Platform
#
#  ✅ جميع متغيرات البيئة مدمجة كـ fallback في app.py
#     ولا تحتاج إلى إضافة يدوية في Render Dashboard.
##########################################################

services:
  - type: web
    name: abu-malk-services
    runtime: python
    region: oregon
    plan: free              # غيّر إلى starter أو standard للإنتاج

    # ── بيئة Python ─────────────────────────────────────
    pythonVersion: "3.11"
    buildCommand: pip install -r requirements.txt

    # ── أمر التشغيل ─────────────────────────────────────
    # gunicorn مع geventwebsocket لدعم Socket.IO
    startCommand: >
      gunicorn main:app
      --worker-class geventwebsocket.gunicorn.workers.GeventWebSocketWorker
      --workers 1
      --bind 0.0.0.0:$PORT
      --timeout 120
      --keep-alive 5
      --log-level info

    # ── متغيرات البيئة ─────────────────────────────────
    # ✅ القيم الافتراضية مدمجة في app.py مباشرةً.
    # يمكن تجاوزها من هنا إن أردت:
    envVars:
      - key: RENDER
        value: "1"
      - key: PORT
        value: "10000"

    # ── فحص الصحة ──────────────────────────────────────
    healthCheckPath: /api/health

    # ── Auto-Deploy عند الدفع لـ GitHub ─────────────────
    autoDeploy: true
